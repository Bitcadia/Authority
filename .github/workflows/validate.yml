name: Validate Authority

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/validate-coverage-audit.test.mjs
      - run: node tools/validate-coverage-audit.mjs
      - run: node tools/validate-strict-publication.mjs

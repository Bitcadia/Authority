name: Publish Authority

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authority-pages-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.mjs
      - run: node tools/validate-coverage-audit.mjs
      - run: node tools/build-publication.mjs . dist
      - run: node tools/validate-publication.mjs . dist
      - uses: actions/upload-artifact@v4
        with:
          name: authority-unsigned-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    environment: authority-signing
    steps:
      - uses: actions/checkout@v4
      - name: Trigger DevOps signing and retrieve signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_DEVOPS_SIGNING_TOKEN: ${{ secrets.AZURE_DEVOPS_SIGNING_TOKEN }}
          AZURE_DEVOPS_SIGNING_PIPELINE: ${{ vars.AZURE_DEVOPS_SIGNING_PIPELINE }}
        run: python3 tools/devops-hook.py
      - uses: actions/upload-artifact@v4
        with:
          name: authority-signed-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  verify:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: authority-signed-${{ github.sha }}
          path: dist/
      - run: node tools/validate-publication.mjs . dist --require-signed
      - name: Retain signed manifest history for offline-client catch-up
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/build-manifest-history.mjs . dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed publication
        id: deployment
        uses: actions/deploy-pages@v4
